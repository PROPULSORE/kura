# Builds and publishes the sync server Docker image, by hand
# (Actions > Server image > Run).
# The image is built here, not in the private source repository, so that
# GitHub links the package to this public repository and it can be public.
# The source is checked out only for the build and never committed here.
# Needs the secret KURA_SOURCE_TOKEN: a fine-grained token with read-only
# "Contents" access to PROPULSORE/kura-estensioni.
name: Server image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the "v" (for example 0.1.0)
        required: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PROPULSORE/kura-estensioni
          token: ${{ secrets.KURA_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: source/server
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/propulsore/kura-server:${{ inputs.version }}
            ghcr.io/propulsore/kura-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/PROPULSORE/kura
            org.opencontainers.image.title=Kura sync server
            org.opencontainers.image.description=Optional self-hosted sync server for the Kura app.
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=LicenseRef-Kura-Freeware
          # A multi-arch image is an index: GitHub reads the source from the
          # index annotations, not from the image labels.
          annotations: |
            index:org.opencontainers.image.source=https://github.com/PROPULSORE/kura
            index:org.opencontainers.image.description=Optional self-hosted sync server for the Kura app.
            index:org.opencontainers.image.licenses=LicenseRef-Kura-Freeware
